<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4EE">
<meta name="robots" content="noindex">
<meta name="description" content="Sign up for a 30-minute interview about student life at VSU Main Campus, for Project CAMPUS, an independent proposal. Not an official VSU study.">
<title>VSUrvey: Interview sign-up</title>
<link rel="preload" href="fonts/atkinson-hyperlegible-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* The interview sign-up, in the survey's look (index.html): the same colors, type, answers, and bottom bar.
   It is a page of its own with its own receiver (volunteer-receiver.gs), so contact details never meet survey answers (D-039). */
@font-face{font-family:"Newsreader";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/newsreader-600.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/atkinson-hyperlegible-400.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/atkinson-hyperlegible-700.woff2") format("woff2")}
:root{
  --ink:#1F2A22; --ink-soft:#52594C; --card:#FFFFFF; --edge:#D6D2C2; --edge-2:#C3BEA9;
  --tile:#F6F6F1; --tile-ink:#1F2A22; --on:#17643A; --on-ink:#FFFFFF; --pick:#E9F2E5;
  --mango:#F2B33D; --gumamela:#D9483B; --sea:#17495A; --leaf:#1E4D3A; --paper:#F3F4EE;
  --green:#17643A; --green-bg:#D5E6D3; --gold:#E2AE1C; --brass:#785808; --brass-bg:#F4E8C1;
  --glow-gold:rgba(250,200,40,.30); --glow-green:rgba(70,185,110,.22);
  --shadow:0 1px 2px rgba(31,42,34,.05),0 16px 36px -18px rgba(31,42,34,.26);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  /* The scene's panel stays the survey's opening green, and what is drawn on it stays light. */
  --bg:#1E4D3A; --scene-ink:#F4F8F5; --stage-h:30vh;
  --table:#C98A4B; --table-top:#E0A867; --stool:#7A4E2A; --ground:rgba(255,255,255,.12); --cup1:#F7FBF8; --cup2:#9ED1DB;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
html::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vw 60vh at 100% 0%,var(--glow-gold),transparent 70%),radial-gradient(60vw 70vh at 0% 100%,var(--glow-green),transparent 70%)}
@media (prefers-contrast:more){ html::before{display:none} }
button{font:inherit;color:inherit}
button,a,input{touch-action:manipulation}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.bar{flex:none;height:50px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:5}
.chap{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px 6px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(31,42,34,.06);color:var(--ink);font:700 14px/1 var(--body);min-width:0}
.chname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;align-items:center;flex:none}
.dots i{display:block;width:7px;height:7px;border-radius:4px;background:currentColor;opacity:.32;transition:width .3s,opacity .3s}
.dots i.done{opacity:.8}
.dots i.now{width:18px;opacity:1;background:var(--green)}
.flag{margin-left:auto;font:700 12.5px/1.2 var(--body);color:var(--brass);background:var(--brass-bg);border:1px solid rgba(120,88,8,.35);padding:6px 10px;border-radius:999px;white-space:nowrap}
@media (max-width:480px){ .flag .rest{display:none} .dots{gap:3px} .dots i{width:6px;height:6px} .dots i.now{width:14px} }
.view{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:none;height:var(--stage-h);transition:height .35s ease;display:flex;align-items:center;justify-content:center;padding:0 10px 8px}
.stage>svg{display:block;width:100%;height:100%;max-width:560px;overflow:visible}
.scene-bg{fill:var(--bg)}
.scene-shadow{fill:rgba(31,42,34,.09)}
.view[data-size="short"]{--stage-h:20vh}
@media (max-height:720px){ .view{--stage-h:24vh} .view[data-size="short"]{--stage-h:15vh} }
.sheet{position:relative;flex:1;min-height:0;background:var(--card);color:var(--ink);border:1px solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -22px rgba(31,42,34,.4)}
@media (min-width:900px){ .sheet{width:min(760px,100%);margin:0 auto;border-bottom:0} }
.panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 18px calc(100px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
.panel-in{max-width:620px;margin:0 auto}
.panel-in.enter-r{animation:inR .32s cubic-bezier(.2,.8,.3,1)}
.panel-in.enter-l{animation:inL .32s cubic-bezier(.2,.8,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.sheet::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--card) 62%);pointer-events:none}

/* ---------- Text and answers ---------- */
.kicker{font:700 11.5px/1.35 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 7px}
.kicker .opt{display:inline-block;margin:0 0 0 6px;padding:1px 7px;border-radius:4px;border:1px solid var(--edge);background:var(--tile);color:var(--ink-soft);font:700 10.5px/1.4 var(--body);letter-spacing:.07em;vertical-align:1px}
.prompt{font:600 clamp(22px,5.8vw,29px)/1.13 var(--display);letter-spacing:-.008em;margin:0 0 6px;max-width:30ch}
.prompt:focus{outline:none}
.prompt:focus-visible{outline:3px solid var(--brass);outline-offset:4px;border-radius:6px}
.lede{font-size:15.5px;color:var(--ink-soft);margin:0 0 14px;max-width:52ch}
.note{font-size:14px;color:var(--ink-soft);margin:12px 0 0}
.note a,.letter a{color:inherit;font-weight:700;white-space:nowrap}
.letter p{margin:0 0 10px;max-width:60ch;font-size:15.5px}
.letter .sign{font:600 17px/1.2 var(--display);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.col{flex-direction:column;align-items:stretch}
.chips.col .chip{text-align:left;border-radius:16px}
@media (min-width:700px){ .chips.two{display:grid;grid-template-columns:1fr 1fr} .chips.two .chip{text-align:left;border-radius:16px} }
.chip{position:relative;padding:10px 15px;border-radius:999px;border:1.5px solid var(--edge);background:var(--tile);color:var(--tile-ink);min-height:44px;cursor:pointer;font-size:15.5px;line-height:1.2;transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on);box-shadow:0 6px 14px -8px rgba(23,100,58,.75)}
@media (hover:hover){ .chip:hover,.agree:hover{border-color:var(--green)} }
.field{width:100%;font:inherit;font-size:17px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--edge);background:var(--card);color:var(--tile-ink);transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:var(--ink-soft);opacity:.8}
.field:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(23,100,58,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 var(--body);padding:16px 24px;border-radius:8px;border:1.5px solid var(--on);background:var(--on);color:var(--on-ink);cursor:pointer;min-height:52px;text-decoration:none;box-shadow:0 10px 24px -12px rgba(23,100,58,.75);transition:background .2s,border-color .2s,transform .2s}
@media (hover:hover){ .btn:not([disabled]):hover{background:var(--ink);border-color:var(--ink);transform:translateY(-1px)} }
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sendrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.consent-list{margin:2px 0 10px;padding:0 0 0 18px;font-size:14.5px;line-height:1.36;max-width:62ch}
.consent-list li{margin:0 0 5px;padding-left:2px}
.consent-list li::marker{color:var(--green)}
.consent-list a{font-weight:700;white-space:nowrap;color:inherit}
.agree{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:6px;padding:12px 14px;border-radius:16px;border:2px dashed var(--edge-2);background:var(--tile);color:var(--tile-ink);cursor:pointer;font:700 16px/1.3 var(--body);transition:border-color .2s,background .2s}
.agree .box2{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink-soft);display:grid;place-items:center}
.agree .box2 svg{width:20px;height:20px;opacity:0}
.agree[aria-pressed="true"]{border-style:solid;border-color:var(--green);background:var(--pick)}
.agree[aria-pressed="true"] .box2{background:var(--green);border-color:var(--green);color:#FFFFFF}
.agree[aria-pressed="true"] .box2 svg{opacity:1}
.nudge-me{animation:nudgeMe .6s ease-in-out 2}
@keyframes nudgeMe{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.agree.nudge-me,.field.nudge-me{box-shadow:0 0 0 4px rgba(226,174,28,.5)}
.warn{color:var(--gumamela);font-weight:700}
/* The Send screen lists what will be sent, so a typo in the contact can be caught. */
.slip{margin:4px 0 0;padding:4px 0;border-top:1px solid var(--edge)}
.slip div{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--edge)}
.slip dt{font:700 13px/1.25 var(--body);color:var(--ink-soft)}
.slip dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.slip dd.empty{font-weight:400;color:var(--ink-soft)}
@media (max-width:699px){ .slip div{padding:6px 0;gap:8px} .slip dt{font-size:12.5px} .slip dd{font-size:15px} #send{display:none} .sendrow.sending{margin-top:8px} }
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--sea);font:700 14px/1 var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
pre.payload{white-space:pre-wrap;font-size:12px;background:var(--tile);padding:10px;border-radius:12px;max-height:220px;overflow:auto}

/* ---------- Bottom bar ---------- */
.nav{position:fixed;z-index:6;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-user-select:none;user-select:none;font:700 16px/1 var(--body)}
.nav svg{width:22px;height:22px;flex:none}
.nav.prev{left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge),0 6px 18px -6px rgba(31,42,34,.3)}
.nav.next{right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:54px;min-width:118px;padding:0 18px 0 24px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge),0 6px 18px -6px rgba(31,42,34,.3);transition:background .25s,color .25s}
.nav.next.ready{background:var(--green);color:#FFFFFF;box-shadow:0 8px 20px -8px rgba(23,100,58,.7)}
.nav.locked{opacity:.45;cursor:default}

/* ---------- The drawing: two stools at a table, and what is being talked about ---------- */
.bubble{transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .25s;transform-origin:262px 96px}
.bubble.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.steam{animation:steam 3s ease-in-out infinite;opacity:.6}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-4px);opacity:.7}}
@media (prefers-reduced-motion:reduce){ .panel-in.enter-r,.panel-in.enter-l,.bubble.pop,.steam,.nudge-me{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="chap"><span class="chname">Interview sign-up</span><span class="dots" id="dots" aria-hidden="true"></span></div>
    <span class="flag" id="flag" hidden></span>
  </header>
  <main class="view" id="view">
    <div class="stage" aria-hidden="true">
      <svg viewBox="0 0 400 210" id="scene">
        <defs><radialGradient id="scene-light" cx="18%" cy="8%" r="85%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/><stop offset=".65" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs>
        <rect class="scene-shadow" x="4" y="7" width="392" height="210" rx="22"/><rect class="scene-bg" width="400" height="210" rx="22"/><rect width="400" height="210" rx="22" fill="url(#scene-light)"/>
        <ellipse cx="200" cy="192" rx="170" ry="12" fill="var(--ground)"/>
        <!-- stools -->
        <g fill="var(--stool)"><rect x="70" y="150" width="56" height="10" rx="5"/><rect x="80" y="158" width="7" height="34" rx="3"/><rect x="109" y="158" width="7" height="34" rx="3"/>
          <rect x="274" y="150" width="56" height="10" rx="5"/><rect x="284" y="158" width="7" height="34" rx="3"/><rect x="313" y="158" width="7" height="34" rx="3"/></g>
        <!-- table -->
        <rect x="190" y="132" width="20" height="60" rx="4" fill="var(--table)"/>
        <rect x="150" y="186" width="100" height="8" rx="4" fill="var(--table)"/>
        <ellipse cx="200" cy="130" rx="66" ry="11" fill="var(--table-top)"/>
        <!-- cups -->
        <g><path d="M168 108h20l-3 18h-14Z" fill="var(--cup1)"/><path d="M188 112h4a4 4 0 0 1 0 8h-5" fill="none" stroke="var(--cup1)" stroke-width="2.5"/>
          <path class="steam" d="M174 102c-3-4 3-6 0-10M181 102c-3-4 3-6 0-10" fill="none" stroke="var(--scene-ink)" stroke-width="2" stroke-linecap="round"/></g>
        <g><path d="M212 110h18l-2.5 16h-13Z" fill="var(--cup2)"/><path d="M230 114h3.5a3.5 3.5 0 0 1 0 7h-4.5" fill="none" stroke="var(--cup2)" stroke-width="2.5"/></g>
        <!-- what the talk is about -->
        <g class="bubble" id="bubble">
          <path d="M236 30h92a14 14 0 0 1 14 14v38a14 14 0 0 1-14 14h-52l-18 14 4-14h-26a14 14 0 0 1-14-14V44a14 14 0 0 1 14-14Z" fill="var(--scene-ink)"/>
          <g id="topic" transform="translate(264 37) scale(2.2)" fill="none" stroke="var(--leaf)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></g>
        </g>
        <g fill="var(--mango)"><circle cx="58" cy="60" r="5"/><circle cx="352" cy="128" r="4"/><circle cx="128" cy="40" r="3"/></g>
      </svg>
    </div>
    <div class="sheet"><div class="panel" id="panel"><div class="panel-in" id="panel-in"></div></div></div>
  </main>
</div>
<button type="button" class="nav prev" id="prev" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" class="nav next" id="next"><span id="next-lbl">Next</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<p class="sr" id="live" aria-live="polite"></p>
<script>
(function () {
  "use strict";
  /* ---------- Settings ---------- */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbw910SVQcEQIjEpomyoXZVElMwmFChrlAeAFpXP93HN87KLPRg7Q8Id5eJp_Fzv954/exec";  // the web app URL of volunteer-receiver.gs, its own Apps Script and private sheet, never the survey's
  var PRODUCTION_HOSTS = ["survey.projectcampus.org"];  // sign-ups are sent only from these addresses (D-157)
  var CONTACT_PHONE = "09491171548";  // the researcher's number, as on the survey's consent screen (D-110)
  var FORM = "volunteer";
  var FORM_VERSION = "v1";
  var OPEN = false;  // set to true only once VSU's permission to run the interviews is in hand (D-083); until then only ?test=1 sign-ups are sent

  var doc = document;
  function $(s, r) { return (r || doc).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || doc).querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var params = (function () { try { return new URLSearchParams(location.search); } catch (e) { return null; } })();
  var TEST = !!(params && params.get("test") === "1");
  var ON_PRODUCTION = PRODUCTION_HOSTS.indexOf(location.hostname) >= 0;
  var LIVE = /^https:\/\/script\.google\.com\//.test(ENDPOINT) && ON_PRODUCTION && (OPEN || TEST);
  var mqReduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function calm() { return !!(mqReduce && mqReduce.matches); }
  var TOUCH = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  var TAP = TOUCH ? "Tap" : "Click";
  var mqPhone = window.matchMedia ? window.matchMedia("(max-width: 699px)") : null;
  function onPhone() { return !!(mqPhone && mqPhone.matches); }
  var PHONE_TEXT = CONTACT_PHONE.replace(/^(\d{4})(\d{3})(\d{4})$/, "$1 $2 $3");
  var PHONE_HREF = "tel:+63" + CONTACT_PHONE.replace(/^0/, "");

  var ICON = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    chat: '<path d="M4 4.5h10a2 2 0 0 1 2 2v5.5a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z"/><path d="M18.5 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-.5v2.5L16 18h-4"/>',
    shield: '<path d="M12 3.5 19 6.5v5c0 4.5-3 7.5-7 9.5-4-2-7-5-7-9.5v-5Z"/><path d="M9 12l2 2 4-4"/>',
    wave: '<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6.5a1.5 1.5 0 0 1 3 0V12m0-5a1.5 1.5 0 0 1 3 0v6.5c0 4-2.6 7-6.5 7-2.6 0-4-1.2-5.3-3.2L3.6 13.6a1.5 1.5 0 0 1 2.5-1.6L8 14"/>',
    phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
    book: '<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5Z"/><path d="M12 6v13.5"/>',
    hall: '<path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',
    house: '<path d="M3.5 11 12 4l8.5 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>',
    group: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 19c.8-3 2.8-4.5 5.5-4.5s4.7 1.5 5.5 4.5M10.5 19c.8-3 2.8-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    send: '<path d="M3.5 11.5 20 4l-6 16-3.2-6.8Z"/><path d="M10.8 13.2 20 4"/>'
  };
  function icon(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + "</svg>"; }

  /* The options match the survey's own (index.html), so the two read alike. */
  var YEARS = ["1st", "2nd", "3rd", "4th", "5th or higher"];
  var FACULTIES = ["Agriculture and Food Science", "Computing", "Engineering", "Forestry and Environmental Science", "Humanities and Social Sciences",
    "Management and Economics", "Natural and Mathematical Sciences", "Nursing", "Teacher Education", "Veterinary Medicine"];
  var RESIDENCE = ["An on-campus dorm", "A boarding house or apartment near campus", "My family's home, and I commute", "A relative's or friend's house", "Somewhere else"];
  var ORG = ["An officer or leader", "An active member", "A member, but I rarely take part", "Not a member of any"];
  var FREE = ["Weekday mornings", "Weekday afternoons", "Weekday evenings", "Weekends"];

  var A = { consent: false, name: "", contact: "", year: null, faculty: null, residence: null, org: null, free: [] };
  var OPTIONAL = "Optional";
  var STEPS = [
    { id: "intro", topic: "chat", size: "tall" },
    { id: "consent", topic: "shield", kicker: "Before you sign up" },
    { id: "name", topic: "wave", kind: "text", key: "name", max: 60, auto: "nickname", kicker: "About you",
      prompt: "What should I call you?", lede: "A first name or a nickname is enough.", ph: "Your first name or nickname" },

  var LABELS = { name: "Call you", contact: "Reach you at", year: "Year level", faculty: "Faculty", residence: "Resides in", org: "In student orgs", free: "Usually free" };

  /* ---------- Moving between steps ---------- */
